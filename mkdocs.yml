site_name: python-injection

repo_name: 100nm/python-injection
repo_url: https://github.com/100nm/python-injection

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Guides:
      - Register dependencies: guides/register-dependencies.md
      - Resolve dependencies: guides/resolve-dependencies.md
      - Scopes: guides/scopes.md
      - Profiles: guides/profiles.md
      - Auto-imports: guides/imports.md
      - Set up main functions: guides/main-functions.md
  - Testing:
      - Test dependencies: testing/test-dependencies.md
      - Writing test classes: testing/classes.md
      - Pytest: testing/pytest.md
  - Thread safety: threadsafety.md
  - Integrations:
      - FastAPI: integrations/fastapi.md

plugins:
  - search

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: blue grey
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.expand
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
